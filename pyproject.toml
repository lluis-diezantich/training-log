[project]
name = "traininglog"
version = "0.1.0"
description = "Static dashboard for a Google Sheets training log"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sheets = ["google-api-python-client>=2.149.0", "google-auth>=2.35.0"]

[project.scripts]
traininglog = "traininglog.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.3", "ruff>=0.7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traininglog"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG"]
# "x" in "2x6-8" is a real multiplication sign in display strings
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
